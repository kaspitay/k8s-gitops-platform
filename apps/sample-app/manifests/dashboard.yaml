apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-dashboard
  namespace: apps
  labels:
    grafana_dashboard: "1"   # Grafana's sidecar loads any ConfigMap with this label
data:
  sample-app.json: |
    {
      "uid": "sample-app",
      "title": "Sample App",
      "tags": ["sample-app", "gitops"],
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Memory per pod (vs request/limit)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}",
              "expr": "container_memory_working_set_bytes{namespace=\"apps\",container=\"nginx\"}" },
            { "refId": "B", "legendFormat": "request",
              "expr": "max(kube_pod_container_resource_requests{namespace=\"apps\",container=\"nginx\",resource=\"memory\"})" },
            { "refId": "C", "legendFormat": "limit",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"apps\",container=\"nginx\",resource=\"memory\"})" }
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "CPU per pod (cores)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}",
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"apps\",container=\"nginx\"}[5m])" }
          ]
        },
        {
          "id": 3, "type": "stat", "title": "Container restarts",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}",
              "expr": "kube_pod_container_status_restarts_total{namespace=\"apps\"}" }
          ]
        }
      ]
    }
